# Railway staging (Vercel production unchanged).
# Docs: docs/BACKUP_DEPLOYMENT.md, docs/RAILWAY_BUILD_PIPELINE.md
#
# Build strategy: GitHub → Railway DOCKERFILE (native, no `railway up`).
# Nixpacks on Metal builders currently fails with:
#   Failed to read app source directory / unpack path missing

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npx prisma migrate deploy && npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
