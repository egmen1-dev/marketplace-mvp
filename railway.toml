# Railway staging (Vercel production unchanged).
# Docs: docs/BACKUP_DEPLOYMENT.md, docs/RAILWAY_BUILD_PIPELINE.md
#
# Build strategy: GitHub → Railway DOCKERFILE + Next standalone.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migration-aware boot — runs prisma migrate deploy before node server.js (see scripts/docker-entrypoint.sh).
# Do NOT regress to "node server.js" — release:railway-config:verify enforces this.
startCommand = "./docker-entrypoint.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
