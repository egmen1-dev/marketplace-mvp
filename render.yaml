# Render Blueprint — backup deployment (does not affect Vercel).
# Dashboard: New → Blueprint → connect this repo.
# Docs: docs/BACKUP_DEPLOYMENT.md

databases:
  - name: marketplace-db
    plan: free

services:
  - type: web
    name: marketplace-mvp
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AUTH_URL
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: STORAGE_PROVIDER
        value: vercel-blob
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: CDEK_CLIENT_ID
        sync: false
      - key: CDEK_CLIENT_SECRET
        sync: false
      - key: CDEK_API_URL
        sync: false
      - key: CDEK_FROM_CITY_CODE
        sync: false
